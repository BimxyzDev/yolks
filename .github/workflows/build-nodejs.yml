name: build nodejs yolks

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 1"
  push:
    branches: [main]
    paths:
      - nodejs/**
      - .github/workflows/build-nodejs.yml

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 21, 22, 23, 24, 25, 26]
        include:
          - node: 19
            debian: bullseye
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./nodejs
          platforms: linux/amd64
          push: true
          build-args: |
            NODE_VERSION=${{ matrix.node }}
            DEBIAN_VARIANT=${{ matrix.debian || 'bookworm' }}
          tags: ghcr.io/bimxyzdev/yolks:nodejs_${{ matrix.node }}
